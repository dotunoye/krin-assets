<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Krin Asset nurtures children after school and creates faith-filled media for the next generation."
    />
    <title>Shop | Krin Asset</title>
    <link rel="icon" type="image/webp" href="assets/images/tab-logo.webp" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/mascot.css" />
    <link rel="stylesheet" href="css/cms.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="index.html" aria-label="Krin Asset home"><img src="assets/images/krin-logo.webp" alt="Krin Asset" /></a>
        <nav class="site-nav" id="primary-navigation" aria-label="Primary navigation">
          <div class="desktop-nav">
            <a class="nav-link" href="index.html">Home</a>
            <div class="nav-dropdown"><a class="dropdown-trigger" href="about.html" aria-haspopup="true">About <span class="dropdown-chevron">⌄</span></a><div class="dropdown-menu"><a href="about.html">Our Story</a><a href="gallery.html">Gallery</a></div></div>
            <div class="nav-dropdown"><button class="dropdown-trigger" type="button" aria-haspopup="true">Programs <span class="dropdown-chevron">⌄</span></button><div class="dropdown-menu"><a href="after-school-haven.html">After School Haven</a><a href="prophetic-kids.html">Prophetic Kids</a></div></div>
            <a class="nav-link active" href="shop.html">Shop</a><a class="nav-link" href="calendar.html">Calendar</a><a class="nav-link" href="contact.html">Contact</a>
          </div>
          <div class="mobile-nav"><a href="index.html">Home</a><a href="about.html">About</a><a href="gallery.html">Gallery</a><a href="after-school-haven.html">After School Haven</a><a href="prophetic-kids.html">Prophetic Kids</a><a class="active" href="shop.html">Shop</a><a href="calendar.html">Calendar</a><a class="mobile-contact" href="contact.html">Contact</a></div>
        </nav>
        <div class="header-actions">
          <button id="cart-toggle" class="nav-cart-btn" aria-label="Open cart">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path
                d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
              ></path>
            </svg>
            <span id="cart-badge" class="cart-badge" style="display: none"
              >0</span
            >
          </button>
          <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-controls="primary-navigation" aria-expanded="false"><span></span><span></span><span></span></button>
        </div>
      </div>
    </header>
    <main id="main">
        <div class="section-heading" style="margin: 2rem auto 0 auto;">
            <span class="eyebrow">A typical day</span>
            <h2>Own a piece of us</h2>
          </div>
      <p id="shop-status" class="cms-status cms-loading" role="status">Loading items…</p>
      <button id="shop-retry" class="cms-retry" type="button" hidden>Try again</button>
      <section class="krin-shop" id="shop-grid" aria-label="Shop products" aria-busy="true"></section>
      <noscript>Please enable JavaScript to load the shop.</noscript>
      <div id="product-modal" class="product-modal" role="dialog" aria-modal="true" aria-labelledby="product-modal-title" hidden>
        <div class="product-modal-content">
          <button type="button" class="product-modal-close" data-product-close aria-label="Close product details">×</button>
          <div class="product-modal-image"><img alt="" /></div>
          <div class="product-modal-details">
            <h2 id="product-modal-title"></h2>
            <p class="product-description"></p>
            <p class="product-price"></p>
            <div class="product-modal-action"></div>
          </div>
        </div>
      </div>

      <!-- The Cart Drawer -->
      <div id="cart-drawer" class="cart-drawer">
        <div class="cart-header">
          <h2>Your Cart</h2>
          <button id="close-cart" class="close-cart-btn">&times;</button>
        </div>

        <div id="cart-items-container" class="cart-items-container">
          <!-- Items will be injected here by JS -->
        </div>

        <div class="cart-footer">
          <div class="cart-total">
            <span>Total:</span>
            <span id="cart-total-price">₦0</span>
          </div>
          <button id="whatsapp-checkout-btn" class="whatsapp-btn">
            Checkout via WhatsApp
          </button>
        </div>
      </div>

      <!-- The dark overlay behind the drawer -->
      <div id="cart-overlay" class="cart-overlay"></div>
    </main>
    <script src="js/main.js"></script>
    <script src="js/sanity.js"></script>
    <script src="js/shop.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Pull existing cart from memory or start a new empty array
        let cart = JSON.parse(localStorage.getItem("krinCart")) || [];

        const badge = document.getElementById("cart-badge");
        const drawer = document.getElementById("cart-drawer");
        const overlay = document.getElementById("cart-overlay");
        const itemsContainer = document.getElementById("cart-items-container");
        const totalEl = document.getElementById("cart-total-price");

        // Update the red number on the cart icon
        const updateBadge = () => {
          badge.textContent = cart.length;
          badge.style.display = cart.length > 0 ? "flex" : "none";
        };

        // Listen for clicks on ANY Add to Cart button
        document.addEventListener("click", (e) => {
            const btn = e.target.closest(".krin-btn-buy");
            if (!btn) return;
            // Build the product object from the HTML data attributes
            const item = {
              id: btn.dataset.id,
              name: btn.dataset.name,
              price: parseInt(btn.dataset.price),
            };

            // Push to array and save to local storage
            cart.push(item);
            localStorage.setItem("krinCart", JSON.stringify(cart));
            updateBadge();

            // Briefly change button text for user feedback
            const originalText = btn.textContent;
            btn.textContent = "Added ✓";
            setTimeout(() => (btn.textContent = originalText), 1500);
        });

        // Build the visual list of items inside the drawer
        const renderCart = () => {
          itemsContainer.innerHTML = "";
          let total = 0;

          if (cart.length === 0) {
            itemsContainer.innerHTML =
              '<p style="text-align:center; padding-top:20px;">Your cart is empty.</p>';
          } else {
            cart.forEach((item, index) => {
              total += item.price;
              itemsContainer.innerHTML += `
          <div class="cart-item">
            <span>${String(item.name).replace(/[&<>"']/g, char => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"})[char])}</span>
            <div style="display:flex; align-items:center; gap:10px;">
              <strong>₦${item.price.toLocaleString()}</strong>
              <button onclick="window.removeItem(${index})" style="color:#e63946; border:none; background:none; cursor:pointer; font-weight:bold; font-size:18px;">
                <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18"></path>
                    <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
            </button>
            </div>
          </div>
        `;
            });
          }
          totalEl.textContent = `₦${total.toLocaleString()}`;
        };

        // Function to remove an individual item from the drawer
        window.removeItem = (index) => {
          cart.splice(index, 1);
          localStorage.setItem("krinCart", JSON.stringify(cart));
          updateBadge();
          renderCart();
        };

        // Drawer Toggle Controls
        const openCart = () => {
          renderCart();
          drawer.classList.add("is-open");
          overlay.classList.add("is-open");
        };

        const closeCart = () => {
          drawer.classList.remove("is-open");
          overlay.classList.remove("is-open");
        };

        // Bind the toggles to the header icon and overlay
        document
          .getElementById("cart-toggle")
          .addEventListener("click", openCart);
        document
          .getElementById("close-cart")
          .addEventListener("click", closeCart);
        overlay.addEventListener("click", closeCart);

        // WhatsApp Checkout Redirect
        document
          .getElementById("whatsapp-checkout-btn")
          .addEventListener("click", () => {
            if (cart.length === 0)
              return alert("Please add items to your cart first.");

            const KRIN_WHATSAPP_NUMBER = "2348072495976";

            let message = "*New Order from Krin Asset Shop* %0A%0A";
            let total = 0;

            cart.forEach((item) => {
              message += `- ${item.name} (₦${item.price.toLocaleString()}) %0A`;
              total += item.price;
            });

            message += `%0A*Total: ₦${total.toLocaleString()}*%0A%0A_Please let me know how to make payment._`;

            // Empty the cart so they don't buy it twice by accident
            localStorage.removeItem("krinCart");
            cart = [];
            updateBadge();
            closeCart();

            // Send the user to WhatsApp
            window.open(
              `https://wa.me/${KRIN_WHATSAPP_NUMBER}?text=${message}`,
              "_blank",
            );
          });

        // Run once on page load to check if they already have items saved
        updateBadge();
      });
    </script>
  </body>
</html>
